name: openknowledge
services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 256
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openknowledge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      GATEWAY_RUNTIME_DB_PASSWORD: ${GATEWAY_RUNTIME_DB_PASSWORD:?GATEWAY_RUNTIME_DB_PASSWORD is required}
      GATEWAY_WORKER_DB_PASSWORD: ${GATEWAY_WORKER_DB_PASSWORD:?GATEWAY_WORKER_DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    networks: [data]

  migrate:
    build: .
    user: "10001:10001"
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 128
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openknowledge}
    env_file: ["${APP_ENV_FILE:-.env.production}"]
    command: ["sh", "-c", "python -m src.gateway.cli migrate && python -m src.gateway.cli ensure-embedding-generation"]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [data]
    restart: "no"

  permissions:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 64
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command: ["psql", "--host=postgres", "--username=${POSTGRES_USER:-postgres}", "--dbname=${POSTGRES_DB:-openknowledge}", "--file=/grant-runtime.sql"]
    volumes:
      - ./deploy/grant-runtime.sql:/grant-runtime.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [data]
    restart: "no"

  gateway:
    build: .
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 1g
    pids_limit: 256
    environment:
      ENVIRONMENT: production
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?TRUSTED_PROXY_CIDRS is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      LEGACY_API_KEYS_ENABLED: ${LEGACY_API_KEYS_ENABLED:-false}
      API_KEY_PEPPERS: ${API_KEY_PEPPERS:?API_KEY_PEPPERS is required}
      ACTIVE_API_KEY_PEPPER_VERSION: ${ACTIVE_API_KEY_PEPPER_VERSION:?ACTIVE_API_KEY_PEPPER_VERSION is required}
      MFA_ENCRYPTION_KEYS: ${MFA_ENCRYPTION_KEYS:?MFA_ENCRYPTION_KEYS is required}
      ACTIVE_MFA_ENCRYPTION_KEY_VERSION: ${ACTIVE_MFA_ENCRYPTION_KEY_VERSION:?ACTIVE_MFA_ENCRYPTION_KEY_VERSION is required}
      DATABASE_URL: postgresql+asyncpg://gateway_runtime:${GATEWAY_RUNTIME_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-openknowledge}
      HOST: 0.0.0.0
      PORT: 8000
      STORAGE_DIR: /data/storage
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_URL: ${LLM_URL:?LLM_URL is required}
      LLM_MODEL_ID: ${LLM_MODEL_ID:?LLM_MODEL_ID is required}
      LLM_FALLBACK_MODEL_IDS: ${LLM_FALLBACK_MODEL_IDS:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_RETRY_ATTEMPTS: ${LLM_RETRY_ATTEMPTS:-3}
      LLM_RETRY_BACKOFF_SECONDS: ${LLM_RETRY_BACKOFF_SECONDS:-0.2}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-20}
      LLM_BULKHEAD_TIMEOUT_SECONDS: ${LLM_BULKHEAD_TIMEOUT_SECONDS:-1}
      LLM_CIRCUIT_FAILURE_THRESHOLD: ${LLM_CIRCUIT_FAILURE_THRESHOLD:-5}
      LLM_CIRCUIT_RECOVERY_SECONDS: ${LLM_CIRCUIT_RECOVERY_SECONDS:-30}
      EMBEDDING_URL: ${EMBEDDING_URL:?EMBEDDING_URL is required}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:?EMBEDDING_MODEL_ID is required}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:?EMBEDDING_DIMENSION is required}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      EMBEDDING_RETRY_ATTEMPTS: ${EMBEDDING_RETRY_ATTEMPTS:-3}
      EMBEDDING_RETRY_BACKOFF_SECONDS: ${EMBEDDING_RETRY_BACKOFF_SECONDS:-0.2}
      EMBEDDING_MAX_CONCURRENCY: ${EMBEDDING_MAX_CONCURRENCY:-20}
      EMBEDDING_BULKHEAD_TIMEOUT_SECONDS: ${EMBEDDING_BULKHEAD_TIMEOUT_SECONDS:-1}
      EMBEDDING_CIRCUIT_FAILURE_THRESHOLD: ${EMBEDDING_CIRCUIT_FAILURE_THRESHOLD:-5}
      EMBEDDING_CIRCUIT_RECOVERY_SECONDS: ${EMBEDDING_CIRCUIT_RECOVERY_SECONDS:-30}
      MAX_TOOL_ITERATIONS: ${MAX_TOOL_ITERATIONS:-10}
      TOOL_TIMEOUT_SECONDS: ${TOOL_TIMEOUT_SECONDS:-15}
      MAX_INTERNAL_TOOL_CALLS: ${MAX_INTERNAL_TOOL_CALLS:-32}
      MAX_REPEATED_TOOL_SIGNATURES: ${MAX_REPEATED_TOOL_SIGNATURES:-2}
      MAX_TOOL_WALL_CLOCK_SECONDS: ${MAX_TOOL_WALL_CLOCK_SECONDS:-180}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-16777216}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      PARSER_MEMORY_LIMIT_BYTES: ${PARSER_MEMORY_LIMIT_BYTES:-134217728}
      PARSER_TIMEOUT_SECONDS: ${PARSER_TIMEOUT_SECONDS:-60}
      RETENTION_PURGE_ENABLED: ${RETENTION_PURGE_ENABLED:-false}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-86400}
      RETENTION_ARCHIVE_DAYS: ${RETENTION_ARCHIVE_DAYS:-365}
      RETENTION_REVISION_DAYS: ${RETENTION_REVISION_DAYS:-1095}
      RETENTION_OPERATIONAL_DAYS: ${RETENTION_OPERATIONAL_DAYS:-30}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-100}
      RETENTION_MAX_BATCHES_PER_CYCLE: ${RETENTION_MAX_BATCHES_PER_CYCLE:-100}
    depends_on:
      permissions:
        condition: service_completed_successfully
    volumes:
      - object-storage:/data/storage
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [app, data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz/ready', headers={'Host': '${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}'}), timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build: .
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 256
    command: ["python", "-m", "src.gateway.worker"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      ENVIRONMENT: production
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      LEGACY_API_KEYS_ENABLED: ${LEGACY_API_KEYS_ENABLED:-false}
      API_KEY_PEPPERS: ${API_KEY_PEPPERS:?API_KEY_PEPPERS is required}
      ACTIVE_API_KEY_PEPPER_VERSION: ${ACTIVE_API_KEY_PEPPER_VERSION:?ACTIVE_API_KEY_PEPPER_VERSION is required}
      MFA_ENCRYPTION_KEYS: ${MFA_ENCRYPTION_KEYS:?MFA_ENCRYPTION_KEYS is required}
      ACTIVE_MFA_ENCRYPTION_KEY_VERSION: ${ACTIVE_MFA_ENCRYPTION_KEY_VERSION:?ACTIVE_MFA_ENCRYPTION_KEY_VERSION is required}
      WORKER_DATABASE_URL: postgresql+asyncpg://gateway_worker:${GATEWAY_WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-openknowledge}
      STORAGE_DIR: /data/storage
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_URL: ${LLM_URL:?LLM_URL is required}
      LLM_MODEL_ID: ${LLM_MODEL_ID:?LLM_MODEL_ID is required}
      LLM_FALLBACK_MODEL_IDS: ${LLM_FALLBACK_MODEL_IDS:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_RETRY_ATTEMPTS: ${LLM_RETRY_ATTEMPTS:-3}
      LLM_RETRY_BACKOFF_SECONDS: ${LLM_RETRY_BACKOFF_SECONDS:-0.2}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-20}
      LLM_BULKHEAD_TIMEOUT_SECONDS: ${LLM_BULKHEAD_TIMEOUT_SECONDS:-1}
      LLM_CIRCUIT_FAILURE_THRESHOLD: ${LLM_CIRCUIT_FAILURE_THRESHOLD:-5}
      LLM_CIRCUIT_RECOVERY_SECONDS: ${LLM_CIRCUIT_RECOVERY_SECONDS:-30}
      EMBEDDING_URL: ${EMBEDDING_URL:?EMBEDDING_URL is required}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:?EMBEDDING_MODEL_ID is required}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:?EMBEDDING_DIMENSION is required}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      EMBEDDING_RETRY_ATTEMPTS: ${EMBEDDING_RETRY_ATTEMPTS:-3}
      EMBEDDING_RETRY_BACKOFF_SECONDS: ${EMBEDDING_RETRY_BACKOFF_SECONDS:-0.2}
      EMBEDDING_MAX_CONCURRENCY: ${EMBEDDING_MAX_CONCURRENCY:-20}
      EMBEDDING_BULKHEAD_TIMEOUT_SECONDS: ${EMBEDDING_BULKHEAD_TIMEOUT_SECONDS:-1}
      EMBEDDING_CIRCUIT_FAILURE_THRESHOLD: ${EMBEDDING_CIRCUIT_FAILURE_THRESHOLD:-5}
      EMBEDDING_CIRCUIT_RECOVERY_SECONDS: ${EMBEDDING_CIRCUIT_RECOVERY_SECONDS:-30}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-16777216}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      PARSER_MEMORY_LIMIT_BYTES: ${PARSER_MEMORY_LIMIT_BYTES:-134217728}
      PARSER_TIMEOUT_SECONDS: ${PARSER_TIMEOUT_SECONDS:-60}
      RETENTION_PURGE_ENABLED: ${RETENTION_PURGE_ENABLED:-false}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-86400}
      RETENTION_ARCHIVE_DAYS: ${RETENTION_ARCHIVE_DAYS:-365}
      RETENTION_REVISION_DAYS: ${RETENTION_REVISION_DAYS:-1095}
      RETENTION_OPERATIONAL_DAYS: ${RETENTION_OPERATIONAL_DAYS:-30}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-100}
      RETENTION_MAX_BATCHES_PER_CYCLE: ${RETENTION_MAX_BATCHES_PER_CYCLE:-100}
      WORKER_METRICS_INTERVAL_SECONDS: ${WORKER_METRICS_INTERVAL_SECONDS:-60}
      WORKER_METRICS_FILE: ${WORKER_METRICS_FILE:-}
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - object-storage:/data/storage
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [data]

  web:
    build: ./web
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 256
    environment:
      GATEWAY_INTERNAL_URL: http://gateway:8000
      NODE_ENV: production
    depends_on:
      gateway:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [app]

  edge:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 128
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    networks: [app]

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  data:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  caddy-config:
  caddy-data:
  object-storage:
  postgres-data:
