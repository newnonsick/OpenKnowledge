name: Legacy contract quarantine

on:
  schedule:
    - cron: "41 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_DB: gateway_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/gateway_test
      MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/gateway_test
      WORKER_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/gateway_test
      EMBEDDING_DIMENSION: "1024"
      LEGACY_CONTRACT_ENFORCE_ALLOWLIST: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/dev.lock
      - id: legacy
        run: timeout 20m pytest tests/e2e -q -m legacy_contract --junitxml=legacy-contract-results.xml
      - if: always()
        env:
          RESULT: ${{ steps.legacy.outcome }}
        run: |
          {
            echo "## Legacy contract quarantine"
            echo "- Owner: platform"
            echo "- Modernization deadline: 2026-10-31"
            echo "- Result: $RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-contract-results
          path: legacy-contract-results.xml
          retention-days: 90
          if-no-files-found: error
