[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-gateway"
version = "0.1.0"
description = "Headless, API-first Local AI Gateway with Internal Shared Knowledge and Pragmatic Clean Architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "pypdf>=5.1.0",
    "python-multipart>=0.0.19",
    "argon2-cffi>=25.1.0",
    "cryptography>=45.0.0",
    "pyotp>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "respx>=0.22.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "live_provider: Tests that call configured live model providers",
    "legacy_contract: Quarantined pre-v1 contracts owned by platform, expires 2026-10-31",
    "tier1: Tier 1 Feature Coverage tests",
    "tier2: Tier 2 Boundary & Corner Case tests",
    "tier3: Tier 3 Combinations & Pairwise tests",
    "tier4: Tier 4 Real-World Scenario tests",
    "tier5: Tier 5 Adversarial Hardening tests",
    "feature(id): Feature ID covered by the test",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/gateway"]
omit = ["tests/*"]
